[project]
name = "financial-intelligence-platform"
version = "0.1.0"
description = "Portfolio intelligence platform with simulated trading and applied ML"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pydantic-settings>=2.5,<3",
  "python-multipart>=0.0.12,<1",
  "scikit-learn>=1.6,<2",
  "scipy>=1.13,<2",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
  "xgboost-cpu>=3.3,<4",
]

[project.optional-dependencies]
semantic = [
  "sentence-transformers>=5.6,<6",
]

[project.scripts]
financial-ai-api = "financial_ai.main:run"
financial-ai-build-category-model = "financial_ai.ml.transaction_classification.modeling.category_artifact:run"
financial-ai-bootstrap-category-model = "financial_ai.ml.transaction_classification.modeling.category_bootstrap:run"
financial-ai-build-text-challenge = "financial_ai.ml.transaction_classification.evaluation.text_classification_challenge:run"
financial-ai-evaluate-text-classification = "financial_ai.ml.transaction_classification.evaluation.text_classification_evaluation:run"
financial-ai-evaluate-semantic-classification = "financial_ai.ml.transaction_classification.evaluation.semantic_baseline:run"
financial-ai-diagnose-classification-validation = "financial_ai.ml.transaction_classification.evaluation.validation_diagnostics:run"
financial-ai-evaluate-semantic-final-test = "financial_ai.ml.transaction_classification.evaluation.semantic_final_test:run"
financial-ai-evaluate-classification-fusion = "financial_ai.ml.transaction_classification.evaluation.fusion_validation:run"
financial-ai-export-category-feedback = "financial_ai.ml.transaction_classification.feedback.feedback_export:run"
financial-ai-train-feedback-candidate = "financial_ai.ml.transaction_classification.feedback.feedback_candidate:run"
financial-ai-promote-category-model = "financial_ai.ml.transaction_classification.feedback.feedback_promotion:run"
financial-ai-write-market-snapshot = "financial_ai.ml.market_forecast.data.snapshot:run"
financial-ai-download-market-snapshot = "financial_ai.ml.market_forecast.data.downloader:run"
financial-ai-build-market-dataset = "financial_ai.ml.market_forecast.data.dataset:run"
financial-ai-evaluate-market-validation = "financial_ai.ml.market_forecast.evaluation.validation_report:run"
financial-ai-select-market-boosting-model = "financial_ai.ml.market_forecast.evaluation.boosting_report:run"
financial-ai-evaluate-market-boosting = "financial_ai.ml.market_forecast.evaluation.boosting_validation_report:run"
financial-ai-diagnose-market-boosting = "financial_ai.ml.market_forecast.evaluation.boosting_diagnostics:run"
financial-ai-evaluate-market-final-test = "financial_ai.ml.market_forecast.evaluation.final_test_report:run"
financial-ai-build-market-forecast-model = "financial_ai.ml.market_forecast.modeling.model_artifact:run"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.7,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/api/src/financial_ai"]

[tool.pytest.ini_options]
pythonpath = ["apps/api/src"]
testpaths = ["apps/api/tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

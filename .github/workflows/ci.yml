name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Lint backend
        run: uv run ruff check apps/api/src apps/api/tests

      - name: Check backend formatting
        run: uv run ruff format --check apps/api/src apps/api/tests

      - name: Verify database migrations
        run: uv run alembic upgrade head

      - name: Test backend
        run: uv run pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build

  containers:
    name: Containers
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build container images
        run: docker compose build

      - name: Start application stack
        run: docker compose up --detach --wait --wait-timeout 240

      - name: Smoke test application stack
        run: |
          curl --fail --show-error http://localhost:8000/health
          curl --fail --show-error http://localhost:5173/health
          curl --fail --show-error http://localhost:5173/api/health
          python3 - <<'PY'
          import json
          from urllib.request import urlopen

          base = "http://localhost:5173/api/v1/market"
          with urlopen(f"{base}/instruments?query=world") as response:
              instrument_id = json.load(response)[0]["id"]
          with urlopen(f"{base}/instruments/{instrument_id}/volatility-forecast") as response:
              forecast = json.load(response)
          assert forecast["model_version"] == "ewma-close-0.94-v1", forecast
          assert forecast["predicted_annualized_volatility"] > 0, forecast
          assert forecast["training_source_feed"] is None, forecast
          PY

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop application stack
        if: always()
        run: docker compose down --volumes --remove-orphans
